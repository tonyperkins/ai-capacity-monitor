esphome:
  name: capacity-square
  friendly_name: Capacity Square
  includes:
    - touch_calibration.h
    - capacity_model.h
    - capacity_ui.h
  build_flags:
    - -DLV_FONT_MONTSERRAT_14=1
    - -DLV_FONT_MONTSERRAT_16=1
    - -DLV_FONT_MONTSERRAT_18=1
    - -DLV_FONT_MONTSERRAT_20=1
    - -DLV_FONT_MONTSERRAT_24=1
    - -DLV_FONT_MONTSERRAT_32=1
    - -DLV_USE_BAR=1
    - -DLV_USE_BUTTON=1
    - -DLV_USE_SLIDER=1
    - -DLV_USE_LABEL=1
    - -DLV_USE_FLEX=1
  on_boot:
    priority: -100
    then:
      - lambda: |-
          capacity_ui::begin(
            [] { id(refresh_now).execute(); },
            [](float value) {
              auto call = id(backlight).turn_on();
              call.set_brightness(value);
              call.set_transition_length(0);
              call.perform();
            });
          capacity_ui::set_brightness_level(id(backlight).current_values.get_brightness());
          capacity_ui::configure_auto_brightness(id(auto_brightness), [](bool on) {
            id(auto_brightness) = on;
            ESP_LOGI("capacity", "Auto brightness %s", on ? "on" : "off");
          });
          capacity_ui::configure_rotation(id(display_rotation),[](int degrees,bool save) {
            id(display_ui).set_rotation(degrees);
            ESP_LOGI("capacity", "Orientation: %d degrees",degrees);
            if(save){id(display_rotation)=degrees;id(persist_rotation).execute();}
          });
          capacity_ui::configure_touch_calibration(id(touch_calibration),
            [] { id(touch).set_swap_xy(false); },
            [](const capacity_touch::Calibration& c, bool save) {
              id(touch).set_swap_xy(c.swap_xy);
              id(touch).set_mirror_x(c.mirror_x);
              id(touch).set_mirror_y(c.mirror_y);
              id(touch).set_calibration(c.xmin,c.xmax,c.ymin,c.ymax);
              ESP_LOGI("touchcal", "Applied X=%d..%d Y=%d..%d mirror=%d,%d swap=%d error=%.1f",c.xmin,c.xmax,c.ymin,c.ymax,c.mirror_x,c.mirror_y,c.swap_xy,c.error);
              if (save) {id(touch_calibration)=c.saved();id(persist_calibration).execute();}
            });
          ESP_LOGI("capacity", "LVGL touch dashboard ready");

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  flash_mode: dio
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    then:
      - delay: 1s
      - script.execute: fetch_snapshot
  on_disconnect:
    then:
      - lambda: capacity_ui::connection_failed();

# Home Assistant native API, used only to follow the office presence sensor
# (and it exposes the Backlight light). Add the device in Home Assistant under
# Settings > Devices & services > ESPHome with api_encryption_key from
# secrets.yaml. Without Home Assistant the display simply stays on.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  on_client_disconnected:
    then:
      - script.execute: screen_wake

binary_sensor:
  - platform: homeassistant
    id: office_occupied
    name: Office occupied
    entity_id: binary_sensor.everything_presence_one_278be8_occupancy
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: return x;
            then:
              - script.execute: screen_wake
            else:
              - script.execute: screen_sleep

# The same sensor's light level drives auto brightness (Settings > Auto).
sensor:
  - platform: homeassistant
    id: office_lux
    name: Office illuminance
    entity_id: sensor.everything_presence_one_278be8_illuminance
    internal: true
    on_value:
      then:
        - lambda: |-
            const int level = capacity_ui::ambient_changed(x);
            // A dark screen stays dark; screen_wake uses the new level.
            if (level < 0 || id(display_ui).is_paused() || !id(backlight).current_values.is_on()) return;
            auto call = id(backlight).turn_on();
            call.set_brightness(level / 100.0f);
            call.set_transition_length(2000);
            call.perform();

globals:
  - id: auto_brightness
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: display_rotation
    type: int
    restore_value: true
    initial_value: '0'
  - id: touch_calibration
    type: std::array<int, 8>
    restore_value: true
    initial_value: '{0,480,0,480,1,1,0,0}'

preferences:
  flash_write_interval: 5min

spi:
  id: lcd_spi
  clk_pin: GPIO48
  mosi_pin: GPIO47

i2c:
  id: touch_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true
  frequency: 400kHz

display:
  - platform: mipi_rgb
    id: panel
    model: GUITION-4848S040
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: touch
    display: panel
    # Match the GUITION panel model's mirrored X and Y orientation.
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      - lambda: capacity_ui::calibration_touch(touch.x_raw,touch.y_raw);
    on_update:
      - lambda: |-
          if (!touches.empty()) capacity_ui::calibration_update(touches.front().x_raw,touches.front().y_raw);
    on_release:
      - lambda: capacity_ui::calibration_release();
      # A tap on a dark screen wakes it; LVGL is paused, so the tap does nothing else.
      - if:
          condition: lvgl.is_paused
          then:
            - script.execute: screen_wake

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_AND_ON
    gamma_correct: 1.0
    default_transition_length: 0s

time:
  - platform: sntp
    id: sntp_clock
    timezone: America/Chicago

lvgl:
  id: display_ui
  displays: [panel]
  touchscreens: [touch]
  default_font: montserrat_18
  buffer_size: 25%
  rotation: 0
  full_refresh: false
  widgets:
    - obj:
        id: bootstrap
        hidden: true
        width: 1
        height: 1

http_request:
  id: bridge_http
  timeout: 4s
  verify_ssl: true

script:
  # Office empty: fade the backlight out and stop rendering. Polling continues,
  # so the data is current on wake.
  - id: screen_sleep
    mode: restart
    then:
      - light.turn_off:
          id: backlight
          transition_length: 1s
      - delay: 1s
      - lvgl.pause:
      - logger.log: "Office empty: screen off"
  # Someone is in the office (or tapped, or Home Assistant went away): light up
  # at the brightness last set on the Settings page.
  - id: screen_wake
    mode: restart
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - logger.log: "Screen on"
      - light.turn_on:
          id: backlight
          brightness: !lambda return capacity_ui::brightness / 100.0f;
          transition_length: 300ms
  - id: persist_rotation
    then:
      - delay: 250ms
      - lambda: |-
          if (esphome::global_preferences->sync()) ESP_LOGI("capacity", "Orientation saved");
          else ESP_LOGW("capacity", "Orientation save failed");
  - id: persist_calibration
    then:
      - delay: 250ms
      - lambda: |-
          if (esphome::global_preferences->sync()) ESP_LOGI("touchcal", "Calibration saved and verified");
          else ESP_LOGW("touchcal", "Calibration save failed");
  # Pull down or "Refresh now": ask the collector to read every provider, then
  # fetch the result once it has had time to finish.
  - id: refresh_now
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: capacity_ui::set_busy(true, "Reading providers...");
            - delay: 75ms
            - http_request.get:
                url: !secret snapshot_url
                request_headers:
                  Authorization: !secret display_authorization
                  X-Capacity-Refresh: "1"
                on_error:
                  then:
                    - lambda: capacity_ui::connection_failed();
            - delay: 10s
            - script.execute: fetch_snapshot
          else:
            - lambda: capacity_ui::connection_failed();
  - id: fetch_snapshot
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: capacity_ui::set_busy(true);
            - delay: 75ms
            - http_request.get:
                url: !secret snapshot_url
                request_headers:
                  Authorization: !secret display_authorization
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          capacity_ui::connection_failed();
                          return;
                        }
                        const bool valid = json::parse_json(body, [](JsonObject root) {
                          return capacity_ui::accept_snapshot(root);
                        });
                        if (!valid) capacity_ui::connection_failed();
                        else ESP_LOGI("capacity", "Snapshot accepted: %u metrics", static_cast<unsigned>(capacity_ui::snapshot.metrics.size()));
                on_error:
                  then:
                    - lambda: capacity_ui::connection_failed();
          else:
            - lambda: capacity_ui::connection_failed();

interval:
  - interval: 60s
    startup_delay: 60s
    then:
      - script.execute: fetch_snapshot
  - interval: 10s
    then:
      - lambda: capacity_ui::tick();
