<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="options.css"><title>Capacity Monitor settings</title></head>
<body><main><p class="eyebrow">CAPACITY MONITOR</p><h1>Collection settings</h1><p class="intro">Choose whether the extension collects in the background and how often it checks your provider pages.</p><section><label class="toggle"><input id="auto-updates" type="checkbox"> <span>Automatic updates</span></label><label class="interval">Collection interval <input id="interval" type="number" min="1" max="1440" step="1" inputmode="numeric"> <span>minutes</span></label><p class="hint">Manual collection and the individual card refresh buttons remain available when automatic updates are paused.</p></section><footer><span id="status" aria-live="polite"></span><button id="save" type="button">Save settings</button></footer></main><script src="options.js"></script></body></html>
