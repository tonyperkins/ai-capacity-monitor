[platformio]
default_envs = cyd-usbc-ili934x

[env]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8
build_flags =
  -DUSER_SETUP_LOADED
  -DUSE_HSPI_PORT
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4

; The maintained CYD reference describes newer USB-C boards as ILI9342.
; TFT_eSPI's compatible initialization profile is named ILI9341_2_DRIVER.
[env:cyd-usbc-ili934x]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER

; Some visually identical USB-C / dual-USB boards ship with an ST7789.
; This alternate environment is kept buildable so identification is a safe,
; reversible reflash instead of a source edit.
[env:cyd-usbc-st7789]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF
  -DCYD_ST7789
