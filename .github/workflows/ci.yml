name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cyd-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build CYD and square display profiles
        run: pio run -d apps/cyd-dashboard -e cyd-usbc-ili934x -e cyd-usbc-st7789 -e square-4848s040

  square-lvgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome==2026.10.2
      - name: Build standalone LVGL dashboard
        run: |
          cp apps/square-dashboard/secrets.example.yaml apps/square-dashboard/secrets.yaml
          esphome compile apps/square-dashboard/capacity.yaml
      - name: Test model and native LVGL interface
        run: |
          cmake -S apps/square-dashboard/tests -B /tmp/capacity-ui-tests -DLVGL_SOURCE="$PWD/apps/square-dashboard/.esphome/build/capacity-square/managed_components/lvgl__lvgl" -DARDUINOJSON_SOURCE="$PWD/apps/square-dashboard/.esphome/build/capacity-square/managed_components/bblanchon__arduinojson"
          cmake --build /tmp/capacity-ui-tests -j2
          cd /tmp
          /tmp/capacity-ui-tests/capacity_ui_tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check shipped scripts
        run: |
          node --check apps/extension/background.js
          node --check apps/extension/popup.js
          node --check apps/extension/options.js
          node --check apps/local-bridge/run.js
          node --check apps/local-bridge/bridge.js
          node --check apps/local-bridge/snapshot.js
          node --check apps/collector/run.js
          node --check apps/collector/collect.js
      - name: Validate snapshot contract is well-formed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('packages/contract/snapshot.v1.json','utf8')); console.log('snapshot.v1.json OK')"
      - name: Run extension test suite
        run: node --test
        working-directory: apps/extension
      - name: Run local bridge test suite
        run: node --test
        working-directory: apps/local-bridge
      - name: Run collector test suite
        run: node --test
        working-directory: apps/collector
      - name: Run dashboard test suite
        run: |
          npm ci
          npm test
        working-directory: apps/dashboard
      - name: Package extension and verify determinism
        run: |
          python3 scripts/package-extension.py
          first=$(sha256sum dist/*.zip | awk '{print $1}')
          rm -rf dist
          python3 scripts/package-extension.py
          second=$(sha256sum dist/*.zip | awk '{print $1}')
          if [ "$first" != "$second" ]; then
            echo "packaging is not deterministic: $first != $second"
            exit 1
          fi
          echo "deterministic package: $first"
