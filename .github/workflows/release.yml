name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run extension test suite
        run: node --test tests/
        working-directory: apps/extension
      - name: Verify tag matches manifest version
        run: |
          manifest_version=$(node -p "require('./apps/extension/manifest.json').version")
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - name: Package extension
        run: python3 scripts/package-extension.py
      - name: Create GitHub release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
